<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#202124" />
    <title>Protobash</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/index.css" />
    <script src="/scram/scramjet.all.js"></script>
    <script src="/baremux/index.js"></script>
    <script src="/register-sw.js" defer></script>
    <script src="/index.js" defer></script>
  </head>
  <body>
    <div class="app-shell" id="top">
      <header class="top-panel">
        <a class="brand" id="show-home" href="/" aria-label="Protobash desktop home">
          <span>protobash</span>
        </a>
        <div class="panel-clock" id="clock">--:--</div>
        <div class="panel-status">
          <button class="privacy-link" id="privacy-button" type="button">Privacy</button>
        </div>
      </header>

      <main class="desktop" aria-label="Desktop">
        <section class="desktop-icons" aria-label="Desktop shortcuts">
          <button class="desktop-icon" data-app="browser" type="button">
            <span class="desktop-icon-art browser-art" aria-hidden="true"><img class="icon" src="https://api.iconify.design/lucide/app-window.svg?color=%23d6e0d6" alt="" /></span>
            <span>Browser</span>
          </button>
        </section>

        <section class="browser-window" id="browser-window" aria-label="Protobash browser">
          <div class="window-titlebar">
            <div class="window-controls">
              <button class="window-control close-control" id="browser-close" aria-label="Close window" title="Close" type="button"></button>
              <button class="window-control minimize-control" id="browser-minimize" aria-label="Minimize window" title="Minimize" type="button"></button>
              <button class="window-control maximize-control" id="browser-maximize" aria-label="Maximize window" title="Maximize" type="button"></button>
            </div>
            <span class="window-title">Browser</span>
            <span class="window-app-label" aria-hidden="true"></span>
          </div>
          <div class="browser-toolbar">
            <div class="browser-controls" aria-label="Browser navigation">
              <button class="toolbar-button" id="browser-back" aria-label="Back" title="Back" type="button"><img class="icon" src="https://api.iconify.design/lucide/arrow-left.svg?color=%23929b93" alt="" /></button>
              <button class="toolbar-button" id="browser-forward" aria-label="Forward" title="Forward" type="button"><img class="icon" src="https://api.iconify.design/lucide/arrow-right.svg?color=%23929b93" alt="" /></button>
              <button class="toolbar-button" id="browser-reload" aria-label="Reload" title="Reload" type="button"><img class="icon" src="https://api.iconify.design/lucide/rotate-cw.svg?color=%23929b93" alt="" /></button>
            </div>
            <form id="sj-form" autocomplete="off">
              <input id="sj-address" type="text" aria-label="Web address or search" placeholder="Search or enter address" />
              <button type="submit">Go</button>
            </form>
            <button class="home-button" id="browser-home" aria-label="Home" title="Home" type="button"><img class="icon" src="https://api.iconify.design/lucide/house.svg?color=%23929b93" alt="" /></button>
          </div>
          <p id="sj-error" class="error" role="alert"></p>
          <div class="browser-stage" id="browser-stage">
            <div class="home-view" id="home-view">
              <section class="welcome" aria-labelledby="welcome-title">
                <h1 id="welcome-title">New tab</h1>
                <p>Enter an address or search term.</p>
              </section>
              <aside class="privacy-note">
                <p>Sites may see the proxy server’s IP address. This does not make you anonymous. <button id="footer-privacy" type="button">Details</button></p>
              </aside>
            </div>
          </div>
        </section>

        <nav class="dock" aria-label="Applications">
          <button class="dock-app active" data-app="browser" type="button"><span class="dock-icon browser-art" aria-hidden="true"><img class="icon" src="https://api.iconify.design/lucide/app-window.svg?color=%23d6e0d6" alt="" /></span><span>Browser</span></button>
          <span class="dock-divider" aria-hidden="true"></span>
          <button class="dock-app" id="show-desktop" type="button"><span class="dock-icon desktop-art" aria-hidden="true"><img class="icon" src="https://api.iconify.design/lucide/monitor.svg?color=%23d6e0d6" alt="" /></span><span>Show desktop</span></button>
        </nav>
      </main>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
